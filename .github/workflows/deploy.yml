name: Deploy

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
  # Started by the CMS when something is published (scripts/export-cms-content.js reads it).
  workflow_dispatch:
  # Daily rebuild so finished passes leave the prerendered pages and JSON-LD even
  # when nothing was published, and a missed CMS dispatch is caught up within a day.
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Fails when the CMS cannot be read, so Pages keeps the previous site instead of one without events.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.storegardensju.se

      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
